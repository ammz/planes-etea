{{ define "main" }}

      <div class="lista px-8">
        <h1 class="text-3xl text-red-700 font-bold mb-10">Objetivos básicos</h1>

        {{ range .Pages.GroupByParam "bloque" }}
        <h4 class="text-xl text-purple-800 font-bold my-3">Bloque {{ title .Key }}</h4>

        <ul>
          {{ range .Pages }}
            <li class="ml-10 my-1" hugo-nav="{{ .RelPermalink}}">
              <a class="text-blue-600" href="{{ .Permalink}}">
		{{ .LinkTitle }}
              </a>
            </li>
          {{ end}}
        </ul>

        {{ end }}
      </div>
{{ end }}
