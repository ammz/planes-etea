{{ define "main" }}

<section class="hero">
  <div class="hero-body">
    <div class="container">
      <div class="content">
        <h1 class="title is-2 has-text-info">{{ .Title }}</h1>
		<ul>
          {{ range .Pages.ByWeight }}
          <li hugo-nav="{{ .RelPermalink}}"><a href="{{ .Permalink}}">{{ .LinkTitle }}</a></li>
          {{ end }}
		</ul>

      </div>
    </div>
  </div>
</section>

{{ end }}
