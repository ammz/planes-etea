{{ define "main" }}

  <section class="hero">
    <div class="hero-body">
      <div class="container">
	<div class="content">
	  <ul>
	    {{ range $key, $taxonomy := .Site.Taxonomies.consejerias }}
	      <li><h2>{{ $key }}</h2></li>
	      <ul>
		{{ range $taxonomy.Pages }}
		  <li hugo-nav="{{ .RelPermalink}}"><a href="{{ .Permalink}}">{{ .LinkTitle }}</a></li>
		{{ end }}
	      </ul>
	    {{ end }}
	  </ul>

	</div>
      </div>
    </div>
  </section>

{{ end }}
