<input type="radio" name="my_tabs_6" class="tab" aria-label="{{.Get `tab`}}" {{.Get `checked`}}="{{.Get `checked`}}" />
<div class="tab-content bg-base-100 border-base-300 p-6">

  {{ .Inner | markdownify }}

  {{ if (and (eq (.Get `tab`) "Seguimiento") .Page.Params.seg) }}
    {{ $base := .Page.File.ContentBaseName }}
    {{ range $k, $v := .Page.Params.seg }}

      {{ $docseg := (printf "portadas/%s--%s.pdf" $base $v) }}
      {{ $segpdf := resources.GetMatch $docseg }}

      <figure class="mb-3 flex">
	<a href="{{ $segpdf.RelPermalink }}" target="_blank">
	  <img class="border border-gray-300"
	       data-pdf-thumbnail-file="{{ $segpdf.RelPermalink }}" data-pdf-thumbnail-height="100" height="100" />
	</a>
      </figure>
    {{ end }}  
  {{ end }}
</div>
